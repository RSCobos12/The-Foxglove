<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP | The Foxglove</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/rsvp.css">
</head>

<body class="page-body">

    <header class="site-header">
  <nav class="nav">
    <a href="../index.html">Home</a>
    <a href="../index.html#welcome">The Foxglove</a>
    <a href="schedule.html">Schedule</a>
    <a href="courses.html">Courses</a>

    <div class="crest">
      <img src="../assets/logos/foxglove-logo-clean.png"
           alt="The Foxglove crest">
    </div>

    <a href="past-winners.html">Past Winners</a>
    <a href="gallery.html">Gallery</a>
    <a href="scores.html">Scores</a>
    <a class="active rsvp" href="rsvp.html">RSVP</a>
  </nav>
</header>

<section class="rsvp-hero">
  <div class="rsvp-hero-overlay"></div>

</section>

<section class="rsvp-content">
  <div class="rsvp-divider">
    <span></span>
    <img src="../assets/icons/foxglove-icon-gold-transparent.png" alt="">
    <span></span>
  </div>

  <div class="rsvp-intro">
    <h2>Your presence is what makes The Foxglove what it is.</h2>
    <p>
      Kindly respond by confirming your attendance for our
      <strong>2027 event.</strong>
    </p>
  </div>

  <form class="rsvp-form">
    <div class="form-row">
      <div class="form-field">
        <label for="firstName">First Name</label>
        <input id="firstName" type="text" name="firstName">
      </div>

      <div class="form-field">
        <label for="lastName">Last Name</label>
        <input id="lastName" type="text" name="lastName">
      </div>
    </div>

    <div class="form-field">
      <label for="attendance">Will You Be Attending?</label>
      <select id="attendance" name="attendance">
        <option value=""></option>
        <option value="yes">Yes, thank you.</option>
        <option value="no">Unfortunately, I am unable to attend.</option>
      </select>
    </div>

    <div class="form-field">
      <label for="email">Email Address</label>
      <input id="email" type="email" name="email">
    </div>

    <div class="form-field">
      <label for="dietary">Dietary Restrictions?</label>
      <textarea id="dietary" name="dietary"></textarea>
    </div>

    <div class="form-field">
      <label for="requests">Special Requests?</label>
      <textarea id="requests" name="requests"></textarea>
    </div>

    <div class="form-actions">
      <button type="submit">Submit</button>
    </div>
  </form>
</section>

<footer class="site-footer">
  <div></div>
  <img src="../assets/logos/foxglove-logo-clean.png" alt="The Foxglove crest">
  <p>The Foxglove</p>
</footer>

<script src="../js/script.js"></script>

</body>
</html>
