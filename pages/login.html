<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Secure login for The Foxglove Invitational members and administrators.">

  <title>Login | The Foxglove Invitational</title>

  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">

  <main class="login-main">

    <section
      class="login-panel"
      aria-labelledby="login-title">

      <div class="login-brand">
        <img
  src="../assets/logos/foxglove-logo-clean.png"
  alt="The Foxglove Crest"
  class="login-logo">
        <p class="login-eyebrow">The Foxglove</p>

        <h1 id="login-title">Member Login</h1>

        <p class="login-intro">
          Sign in to access The Foxglove member platform.
        </p>
      </div>

      <form
        id="login-form"
        class="login-form">

        <div class="login-field">
          <label for="login-email">Email Address</label>

          <input
            id="login-email"
            name="email"
            type="email"
            autocomplete="email"
            required>
        </div>

        <div class="login-field">
  <label for="login-password">Password</label>

  <div class="login-password-control">
    <input
      id="login-password"
      name="password"
      type="password"
      autocomplete="current-password"
      minlength="12"
      required>

    <button
      class="login-password-toggle"
      id="login-password-toggle"
      type="button"
      aria-label="Show password"
      aria-pressed="false">
      Show
    </button>
  </div>
</div>

        <div
          id="login-message"
          class="login-message"
          role="status"
          aria-live="polite"
          hidden>
        </div>

        <button
          class="login-submit"
          type="submit">
          Sign In
        </button>

      </form>

      <p class="login-support">
        Authorized members only. Not you Abe. Not until you show up to one of these.
      </p>

      <a
        class="login-return"
        href="../index.html">
        Return to the public website
      </a>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/auth.js" defer></script>

</body>
</html>
