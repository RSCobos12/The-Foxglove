<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Reset your Foxglove account password.">

  <title>Forgot Password | The Foxglove</title>

  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">

  <main class="login-main">

    <section
      class="login-panel"
      aria-labelledby="forgot-password-title">

      <div class="login-brand">

        <img
          src="../assets/logos/foxglove-logo-clean.png"
          alt="The Foxglove Crest"
          class="login-logo">

        <p class="login-eyebrow">
          The Foxglove
        </p>

        <h1 id="forgot-password-title">
          Password Recovery
        </h1>

        <p class="login-intro">
          Enter the email associated with your Foxglove account. We'll send you a secure link to create a new password.
        </p>

      </div>

      <form
        id="forgot-password-form"
        class="login-form">

        <div class="login-field">

          <label for="recovery-email">
            Email Address
          </label>

          <input
            id="recovery-email"
            type="email"
            autocomplete="email"
            required>

        </div>

        <div
          id="forgot-password-message"
          class="login-message"
          hidden>
        </div>

        <button
          class="login-submit"
          type="submit">

          Send Recovery Email

        </button>

      </form>

      <a
        class="login-return"
        href="login.html">

        Return to Login

      </a>

    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/forgot-password.js"></script>

</body>

</html>
