<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Create a new password for your Foxglove account.">

  <title>Reset Password | The Foxglove</title>

  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/login.css">
</head>

<body class="login-page">

  <main class="login-main">

    <section
      class="login-panel"
      aria-labelledby="reset-password-title">

      <div class="login-brand">

        <img
          src="../assets/logos/foxglove-logo-clean.png"
          alt="The Foxglove Crest"
          class="login-logo">

        <p class="login-eyebrow">
          The Foxglove
        </p>

        <h1 id="reset-password-title">
          Create New Password
        </h1>

        <p class="login-intro">
          Enter and confirm your new account password.
        </p>

      </div>

      <div
        id="reset-password-loading"
        class="login-message"
        role="status"
        aria-live="polite">

        Validating your recovery link...

      </div>

      <form
        id="reset-password-form"
        class="login-form"
        hidden>

        <div class="login-field">

          <label for="new-password">
            New Password
          </label>

          <input
            id="new-password"
            name="password"
            type="password"
            autocomplete="new-password"
            minlength="12"
            required>

        </div>

        <div class="login-field">

          <label for="confirm-new-password">
            Confirm New Password
          </label>

          <input
            id="confirm-new-password"
            name="passwordConfirmation"
            type="password"
            autocomplete="new-password"
            minlength="12"
            required>

        </div>

        <div
          id="reset-password-message"
          class="login-message"
          role="status"
          aria-live="polite"
          hidden>
        </div>

        <button
          id="reset-password-submit"
          class="login-submit"
          type="submit">

          Update Password

        </button>

      </form>

      <a
        class="login-return"
        href="login.html">

        Return to Login

      </a>

    </section>

  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <script src="../js/auth.js"></script>
<script src="../js/reset-password.js"></script>

</body>

</html>
